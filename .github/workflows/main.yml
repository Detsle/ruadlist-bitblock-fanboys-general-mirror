name: Update adblock filter mirrors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - "scripts/update_filters.py"
  schedule:
    # Upstream says the combined list refresh interval is one day but has no
    # fixed public release hour. Check once near the end of each UTC day.
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-adblock-mirrors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download, validate and update filter files
        run: python scripts/update_filters.py

      - name: Create a Russia-friendlier short alias for TV Bro
        shell: bash
        run: |
          set -u
          existing=""
          if [ -s short-url.txt ]; then existing="$(cat short-url.txt)"; fi
          if [[ "$existing" =~ ^https://clck\.ru/[A-Za-z0-9]+$ ]]; then
            echo "Yandex Clicker URL already exists: $existing"
            exit 0
          fi

          # Use jsDelivr's Fastly endpoint rather than raw.githubusercontent.com.
          # This may improve availability in some Russian networks, but ISP access
          # still must be checked on the actual TV/network.
          target="https://fastly.jsdelivr.net/gh/Detsle/ruadlist-bitblock-fanboys-general-mirror@main/ruadlist+easylist.txt"
          response="$(curl -fsSLG --data-urlencode "url=$target" "https://clck.ru/--" 2>/dev/null || true)"
          response="$(printf '%s' "$response" | tr -d '\r\n')"
          if [[ "$response" =~ ^https://clck\.ru/[A-Za-z0-9]+$ ]]; then
            printf '%s\n' "$response" > short-url.txt
            echo "Created Russia-friendlier short URL: $response"
          else
            echo "Yandex Clicker did not return a usable URL; keeping the previous alias."
          fi

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- ruadlist+easylist.txt main/bitblock.txt short-url.txt; then
            echo "No filter or short-link changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruadlist+easylist.txt main/bitblock.txt
          if [ -f short-url.txt ]; then git add short-url.txt; fi
          git commit -m "Update mirrored adblock filters: $(date -u +"%Y-%m-%d %H:%M UTC")"

          # Another user/automation may push while this job is downloading.
          # Rebase our filter commit on the newest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Could not rebase filter update onto origin/main." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another update; retrying ($attempt/3)..."
            sleep "$((attempt * 2))"
          done
          echo "Could not push filter update after 3 attempts." >&2
          exit 1
