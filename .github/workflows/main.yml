name: Update adblock filter mirrors

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - "scripts/update_filters.py"
  schedule:
    # The upstream combined list declares a 1-day refresh interval, but does
    # not publish a fixed release time. Check once near the end of each UTC day.
    - cron: "17 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-adblock-mirrors
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download, validate and update filter files
        run: python scripts/update_filters.py

      - name: Commit changes
        run: |
          if git diff --quiet -- ruadlist+easylist.txt main/bitblock.txt; then
            echo "No filter changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ruadlist+easylist.txt main/bitblock.txt
          git commit -m "Update mirrored adblock filters: $(date -u +"%Y-%m-%d %H:%M UTC")"
          git push origin HEAD:main
